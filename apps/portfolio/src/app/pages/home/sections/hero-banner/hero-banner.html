@let page = content();
<section class="banner" aria-labelledby="hero-heading">
  <div class="sky" aria-hidden="true"></div>
  <div class="sun">
    @if (page.portrait; as portrait) {
    <img [ngSrc]="portrait.src" [alt]="portrait.alt" fill priority />
    }
  </div>

  <div class="hero-body">
    <h1 id="hero-heading">
      <span class="greeting">Hi, I’m {{ page.name }},</span>
      <span class="role">{{ page.role }}</span>
    </h1>
    <div class="pitch">
      <p class="headline">{{ page.headline }}</p>
      <p class="intro">{{ page.introduction }}</p>
      <a matButton="filled" class="button-light" href="#work"
        >Explore the work<app-cta-arrow
      /></a>
    </div>
  </div>

  <ol class="services" aria-label="What I do">
    @for (service of page.services; track service) {
    <li>
      <span class="service-index" aria-hidden="true"
        >#{{ $index + 1 | number: '2.0' }}</span
      >
      {{ service }}
    </li>
    }
  </ol>
</section>
